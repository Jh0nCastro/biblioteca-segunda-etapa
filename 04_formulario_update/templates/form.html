{% extends "base.html" %}

{% block titulo %}{{ "Editar" if livro else "Novo" }} livro | Biblioteca{% endblock %}

{% block conteudo %}
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-4">{{ "Editar livro" if livro else "Cadastrar livro" }}</h1>

          <form method="post">
            <div class="row g-3">
              <div class="col-md-5">
                <label class="form-label" for="isbn">ISBN</label>
                <input class="form-control" id="isbn" name="isbn" required value="{{ livro.isbn if livro else request.form.get('isbn', '') }}">
              </div>
              <div class="col-md-7">
                <label class="form-label" for="titulo">Título</label>
                <input class="form-control" id="titulo" name="titulo" required value="{{ livro.titulo if livro else request.form.get('titulo', '') }}">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="autor">Autor</label>
                <input class="form-control" id="autor" name="autor" required value="{{ livro.autor if livro else request.form.get('autor', '') }}">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="editora">Editora</label>
                <input class="form-control" id="editora" name="editora" required value="{{ livro.editora if livro else request.form.get('editora', '') }}">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="ano_publicacao">Ano de publicação</label>
                <input class="form-control" id="ano_publicacao" name="ano_publicacao" type="number" min="0" required value="{{ livro.ano_publicacao if livro else request.form.get('ano_publicacao', '') }}">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="quantidade">Quantidade</label>
                <input class="form-control" id="quantidade" name="quantidade" type="number" min="0" required value="{{ livro.quantidade if livro else request.form.get('quantidade', 1) }}">
              </div>
            </div>

            <div class="d-flex gap-2 mt-4">
              <button class="btn btn-primary" type="submit">Salvar</button>
              <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
